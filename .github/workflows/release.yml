name: Build and release GOST

on:
  push:
    branches:
      - '*-t2vg'
    tags:
      - 'v*-t2vg'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GOFLAGS: -mod=readonly

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Test
        run: go test ./cmd/gost github.com/andybalholm/brotli
      - name: Set up GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          install-only: true
      - name: Check release configuration
        run: goreleaser check
      - name: Build all platforms
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: goreleaser release --snapshot --clean --skip=publish

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
      - name: Publish release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
