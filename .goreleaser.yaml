version: 2

builds:
  - id: gost
    env:
      - CGO_ENABLED=0
    main: ./cmd/gost
    targets:
      - darwin_amd64
      - darwin_arm64
      - linux_386
      - linux_amd64
      - linux_amd64_v3
      - linux_arm_5
      - linux_arm_6
      - linux_arm_7
      - linux_arm64
      - linux_mips_softfloat
      - linux_mips_hardfloat
      - linux_mipsle_softfloat
      - linux_mipsle_hardfloat
      - linux_mips64
      - linux_mips64le
      - linux_s390x
      - linux_riscv64
      - linux_loong64
      - freebsd_386
      - freebsd_amd64
      - windows_386
      - windows_amd64
      - windows_amd64_v3
      - windows_arm64
      - android_arm64
    ldflags:
      - "-s -w -X 'main.version={{ .Version }}'"

archives:
  - ids:
      - gost
    formats:
      - tar.gz
    builds_info:
      group: root
      owner: root
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats:
        - zip

checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ .Version }}-snapshot"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'

release:
  prerelease: auto
  mode: keep-existing

